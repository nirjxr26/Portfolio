name: Security & Quality Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0' # Weekly Sunday audit

jobs:
  security-audit:
    name: Security & Build Check
    runs-on: ubuntu-latest
    steps:
      # Pinned to immutable SHAs (not mutable tags) against tag-hijack attacks.
      # checkout@v4 @ 2026-09-15 / setup-node@v4 @ 2026-09-15 — refresh via:
      # git ls-remote https://github.com/actions/<repo>.git refs/tags/v4
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Security Audit (Critical Level)
        run: npm audit --omit=dev --audit-level=critical

      - name: TypeScript Typecheck
        run: npm run build
